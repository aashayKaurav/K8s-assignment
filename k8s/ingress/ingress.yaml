apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: k8s-assignment
  labels:
    app: k8s-assignment
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # API routes — forward to backend service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          # All other routes — forward to frontend service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
