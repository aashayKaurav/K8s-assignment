# Exercise 2: Something is wrong with this deployment — can you find it?
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-broken-2
  namespace: k8s-assignment
  labels:
    app: backend-broken-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-broken-2
  template:
    metadata:
      labels:
        app: backend-broken-2
    spec:
      containers:
        - name: backend
          image: k8s-backend:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: db-secret-typo
